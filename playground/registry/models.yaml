  # ---------------- Optional OpenAI-compatible endpoints (untested rows) ----------------
  - id: llamacpp-local
    display_name: llama.cpp server (frames)
    provider: openai_compat
    model_id: default
    base_url: http://127.0.0.1:8080/v1
    input_modes: [frames]
    params: {temperature: 0.4, max_tokens: 4096}
    tokens_per_frame: 300
    prices: {text_in: 0, image_in: 0, video_in: 0, audio_in: 0, cached_in: 0, out: 0}
    licence: depends on model
    enabled: false

  # ---------------- Development only ----------------
  # Fake model for exercising the UI without a key or GPU. Available only when PLAYGROUND_MOCK=1.
  - id: mock-local
    display_name: Mock local model (dev)
    provider: mock
    model_id: mock-echo
    input_modes: [frames]
    params: {temperature: 0, max_tokens: 1024, delay_s: 6}
    tokens_per_frame: 300
    prices: {text_in: 0, image_in: 0, video_in: 0, audio_in: 0, cached_in: 0, out: 0}
